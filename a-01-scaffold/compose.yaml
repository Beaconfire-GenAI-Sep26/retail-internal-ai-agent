name: retail-internal-ai-agent

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-setup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-retail_agent}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in your local .env file}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD in your local .env file}
      DOMAIN_DB_PASSWORD: ${DOMAIN_DB_PASSWORD:?Set DOMAIN_DB_PASSWORD in your local .env file}
      EVAL_DB_PASSWORD: ${EVAL_DB_PASSWORD:?Set EVAL_DB_PASSWORD in your local .env file}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in your local .env file}
    volumes:
      - ./database:/setup:ro
    entrypoint: ["/bin/sh", "/setup/provision.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build: ./services/auth
    environment:
      ROOT_PATH: /auth
      DATABASE_URL: postgresql+psycopg://auth_svc@postgres:5432/${POSTGRES_DB:-retail_agent}
      PGPASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in your local .env file}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  agent:
    build: ./services/agent
    environment:
      ROOT_PATH: /agent
      DATABASE_URL: postgresql+psycopg://agent_svc@postgres:5432/${POSTGRES_DB:-retail_agent}
      PGPASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD in your local .env file}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  domain:
    build: ./services/domain
    environment:
      ROOT_PATH: /domain
      DATABASE_URL: postgresql+psycopg://domain_svc@postgres:5432/${POSTGRES_DB:-retail_agent}
      PGPASSWORD: ${DOMAIN_DB_PASSWORD:?Set DOMAIN_DB_PASSWORD in your local .env file}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]

  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    depends_on:
      auth:
        condition: service_healthy
      agent:
        condition: service_healthy
      domain:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
