name: retail-internal-ai-agent

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_agent}
      POSTGRES_USER: ${POSTGRES_USER:-retail_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth:
    build: ./services/auth
    environment:
      ROOT_PATH: /auth
    healthcheck: *api-healthcheck

  agent:
    build: ./services/agent
    environment:
      ROOT_PATH: /agent
    healthcheck: *api-healthcheck

  domain:
    build: ./services/domain
    environment:
      ROOT_PATH: /domain
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-retail_agent}
      POSTGRES_USER: ${POSTGRES_USER:-retail_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]

  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    depends_on:
      auth:
        condition: service_healthy
      agent:
        condition: service_healthy
      domain:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
