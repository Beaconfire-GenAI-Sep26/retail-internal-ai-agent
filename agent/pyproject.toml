[project]
name = "retail-agent"
version = "0.2.0"
description = "Agent Service: the LangGraph investigation for store-level M&I cases"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1,<2",
    "fastapi==0.164.0",
    "httpx>=0.28.1",
    "langgraph>=1,<2",
    "langfuse==4.18.0",
    "langchain==1.5.2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "PyJWT==2.10.1",
    "python-ulid>=4.2.0",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_domain: needs a running, seeded Domain Service; set AGENT_IT_DOMAIN_URL and AGENT_IT_JWT_SECRET",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]
