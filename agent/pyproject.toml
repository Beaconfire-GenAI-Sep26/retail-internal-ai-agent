[project]
name = "retail-agent"
version = "0.2.0"
description = "Store-scoped investigation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.164.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
    "langfuse==4.18.0",
    "langgraph==1.2.23",
    "anthropic==0.125.0",
    "langchain==1.5.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<10"]
