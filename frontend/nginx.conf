# [D2] nginx — serves the React build only
#
# Browser ──▶ API Gateway (Nginx, A-01) ─┬─ /auth/...   → Auth Service
#                                         ├─ /agent/...  → Agent Service
#                                         ├─ /domain/... → Domain Service
#                                         └─ /           → this container
#
# No API proxy block here: API routing lives in Quang's API Gateway (A-01).

server {
    listen 80;
    root /usr/share/nginx/html;

    # ═══════════════════════════════════════════════════════════════
    # 1. Hashed build assets — safe to cache for a long time
    # ═══════════════════════════════════════════════════════════════
    # Vite puts a content hash in every file name under /assets/
    # (index-C26zfjbI.js), so a new build always gets a new URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ═══════════════════════════════════════════════════════════════
    # 2. React app — unknown paths fall back to index.html
    # ═══════════════════════════════════════════════════════════════
    # /cases/CASE-0001 is not a file on disk; try_files serves index.html instead,
    # and React Router renders the right page → hard refresh on any page works.
    # index.html itself is never cached, so a redeploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
