resolver 127.0.0.11 valid=10s;

map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
}

map $uri $path_case_id {
    default "";
    "~^/domain/(?:internal/)?cases/(CASE-[0-9]{4,})(?:/|$)" $1;
}
map $http_x_case_id $log_case_id {
    default $path_case_id;
    "~^CASE-[0-9]{4,}$" $http_x_case_id;
}
map $http_x_investigation_id $log_investigation_id {
    default "";
    "~^INV-[A-Za-z0-9-]{1,64}$" $http_x_investigation_id;
}
map $uri $service_route {
    default frontend;
    ~^/auth/ auth;
    ~^/agent/ agent;
    ~^/domain/ domain;
}

# No IPs, raw URL/query, cookies, credentials or request/response bodies.
log_format correlated escape=json '{"timestamp":"$time_iso8601","service":"gateway",'
    '"event":"http.request","request_id":"$correlation_id","case_id":"$log_case_id",'
    '"investigation_id":"$log_investigation_id","route":"$service_route",'
    '"method":"$request_method","status_code":$status,"duration_seconds":$request_time,'
    '"upstream_duration_seconds":"$upstream_response_time"}';
access_log /dev/stdout correlated;
# Nginx's normal error lines contain the full URL. Access events capture 4xx/5xx.
error_log /dev/stderr crit;

upstream auth_api {
    zone auth_api 64k;
    server auth:8000 resolve;
}

upstream agent_api {
    zone agent_api 64k;
    server agent:8000 resolve;
}

upstream domain_api {
    zone domain_api 64k;
    server domain:8000 resolve;
}

upstream frontend_app {
    zone frontend_app 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_set_header X-Case-ID $log_case_id;
    proxy_set_header X-Investigation-ID $log_investigation_id;
    proxy_set_header X-Trace-ID "";
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $correlation_id always;
    # Browser-supplied service credentials never cross the public gateway.
    proxy_set_header X-Service-Token "";

    location = /domain/internal { return 404; }
    location ^~ /domain/internal/ { return 404; }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /auth/ {
        proxy_pass http://auth_api/;
    }

    location /agent/ {
        proxy_pass http://agent_api/;
    }

    location /domain/ {
        proxy_pass http://domain_api/;
    }

    location / {
        proxy_pass http://frontend_app;
    }
}
