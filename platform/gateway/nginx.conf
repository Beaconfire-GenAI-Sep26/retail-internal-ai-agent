resolver 127.0.0.11 valid=10s;

map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
}

upstream auth_api {
    zone auth_api 64k;
    server auth:8000 resolve;
}

upstream agent_api {
    zone agent_api 64k;
    server agent:8000 resolve;
}

upstream domain_api {
    zone domain_api 64k;
    server domain:8000 resolve;
}

upstream frontend_app {
    zone frontend_app 64k;
    server frontend:80 resolve;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $correlation_id always;
    # Browser-supplied service credentials never cross the public gateway.
    proxy_set_header X-Service-Token "";

    location = /domain/internal { return 404; }
    location ^~ /domain/internal/ { return 404; }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /auth/ {
        proxy_pass http://auth_api/;
    }

    location /agent/ {
        proxy_pass http://agent_api/;
    }

    location /domain/ {
        proxy_pass http://domain_api/;
    }

    location / {
        proxy_pass http://frontend_app;
    }
}
